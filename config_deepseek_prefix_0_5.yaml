model:
  pretrained_model_path: "/home/student008/GRPO-zero/Qwen2.5-3B-base/models--Qwen--Qwen2.5-3B/snapshots/3aab1f1954e9cc14eb9509a215f9e5ca08227a9b"
  device: "cuda:0"
  dtype: "bfloat16"

data:
  path: "gsm8k"          # ← 你的 GSM8K 数据存放目录
  config_name: "main"    # ← 可选: "main" 或 "socratic"
  test_size: 128

training:
  random_seed: 1337

  # GSM8K 题目较长，把 prompt 长度稍微调大
  max_prompt_len: 512
  max_gen_len: 1024
  
  # 采样参数
  temperature: 0.9            # 采样温度，控制随机性（1.0=标准采样，>1.0=更随机，<1.0=更确定）

  batch_size: 128
  num_questions_per_batch: 32

  micro_batch_size: 8
  max_grad_norm: 1.0
  learning_rate: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]

  ckpt_dir: "ckpt"
  log_dir: "logs"
  eval_results_dir: "eval_results"  # 评估结果保存目录（JSONL格式）

  skip_unfinished_episodes: false
  ckpt_save_interval: 100
  eval_interval: 10

  memory_efficient_adamw: false

  num_epochs: 3        # 训练轮数（跑完整个数据集的次数）。不设则默认 1
  max_steps: null      # 限制总步数（全局 step 计数）。例如 2000；设为 null/0/不写表示不限制

  # GRPO 算法相关配置
  # Dynamic Clipping 参数
  use_dynamic_clipping: false   # 是否使用 dynamic clipping（true=动态裁剪，false=固定裁剪PPO风格）
  epsilon_low: 0.3              # Dynamic clipping 下界参数
  epsilon_high: 0.3             # Dynamic clipping 上界参数
  
  # 固定值 Clipping 参数（当 use_dynamic_clipping=false 时使用）
  clip_ratio: 0.2               # PPO-style 固定 clip ratio（0.0=不使用裁剪，0.2 表示 [0.8, 1.2]）
  
  # KL 散度正则化参数
  use_kl_penalty: false         # 是否使用 KL 散度正则化
  kl_coeff: 0.02          # KL 散度正则项系数（仅在 use_kl_penalty=true 时生效）
  
  # Reward 归一化参数
  use_length_grouping: false     # 是否使用长度分组进行 reward 归一化
  
  # Prefix 训练模式配置
  enable_prefix: true            # 是否启用 prefix 训练模式
  prefix_file: "/data/liuxinyu/prefixes.json"              # Prefix 文件路径（JSON格式，由 generate_prefixes.py 生成）
                                 # 如果为 null，则训练时不会使用预生成的 prefix
  prefix_dropout_prob: 1.0       # Prefix dropout 概率（使用 DeepSeek 的概率，否则用 3B 采样）
  prefix_use_prob: 0.5           # 训练时使用prefix的概率（用于与eval分布一致，0.5表示50%使用prefix，50%不使用）
  prefix_sft_coeff: 0.2          # Prefix-SFT loss 系数（推荐 0.1-0.3）
  prefix_teacher_model: "deepseek/deepseek-v3.2"  # Teacher 模型（OpenRouter）
  # 注意：prefix 只按两句话截断，不限制 token 数量
  # 使用流程：
  # 1. 运行 python generate_prefixes.py --config config.yaml --output prefixes.json
  # 2. 在 config.yaml 中设置 prefix_file: "prefixes.json"
  # 3. 设置 enable_prefix: true 开始训练
  
wandb:
  enable: true
  project: mathgrpo
  entity: amdyes   # 可选
  run_name: "deepseek_prefix_1228_prefix_use_prob_0_5"                    # 为空则用时间戳
  mode: online                    # 或 offline/disabled
  watch_model: false              # 是否记录梯度/参数直方图
  watch_log_freq: 100
  log_text_every: 100             # 多久记录一次文本样例
  num_text_samples: 4             # 每次记录多少条样例
  save_ckpt_artifact: false       # 是否把 ckpt 作为 artifact 上传
  artifact_name_prefix: grpo-qwen